<!DOCTYPE html>
<html><head><title>College Network Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0a1a33;color:white;font-family:Arial;padding:30px}
h1{font-size:32px;margin:0 0 20px 10px}
.screen{background:#0f2a4d;border:3px solid #4a6a8a;border-radius:20px;padding:20px;max-width:1000px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:#10b981;color:white;padding:6px 18px;border-radius:20px;font-weight:bold;font-size:13px}
.small{color:#9ab0c9;font-size:14px}
.cards{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.card{flex:1;min-width:140px;background:#14365e;border:1px solid #2dd4a0;border-radius:10px;padding:14px}
.card.red{border-color:#f87171;background:#4a1a2a}
.card b{font-size:15px}.card p{margin:6px 0 0;color:#2dd4a0;font-weight:bold}
.card.red p{color:#f87171}.card small{color:#9ab0c9}
.dot{width:12px;height:12px;border-radius:50%;background:#2dd4a0;display:inline-block;margin-right:6px}
.card.red .dot{background:#f87171}
.fault{border:2px solid #f87171;border-radius:12px;padding:20px;background:#2a1a2e;margin-top:10px}
.fault h3{margin:0 0 10px;color:#f87171}
.fault p{margin:6px 0;color:#e2e8f0}
.fault b{color:white}
.bottom{display:flex;justify-content:center;gap:15px;margin-top:25px;flex-wrap:wrap}
.bottom span{background:#334155;padding:12px 30px;border-radius:30px;font-weight:bold}
button{background:#10b981;border:0;color:white;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;margin-top:10px}
</style></head>
<body>
<h1>College Network Dashboard - LIVE</h1>
<div class="screen">
<div class="top"><span class="pill" id="pill">LIVE STATUS - Loading...</span><span class="small" id="counts"></span></div>
<div class="cards" id="cards">Loading...</div>
<div id="faults"></div>
</div>
<div class="bottom"><span id="total">Total: -</span><span id="online">Online: -</span><span id="offline">Offline: -</span><span>Critical: <b id="critical">-</b></span></div>
<p style="text-align:center;color:#9ab0c9">An Explainable Rule-Based Network Fault Diagnosis System - Umar Farooq (2340) | Muhammad Ijaz (2339)</p>
<script>
async function load(){
  try{
    let r = await fetch('/api/devices'); let d = await r.json();
    let list = Array.isArray(d) ? d : (d.devices || d.data || []);
    let ov=null; try{ let r2=await fetch('/api/overview'); ov=await r2.json(); }catch(e){}
    let total=list.length, online=list.filter(x=> (x.status||'').toUpperCase()==='UP').length;
    if(ov){ total=ov.total??total; online=ov.online??online; }
    let offline=total-online;
    let crit=ov?.critical ?? offline;
    document.getElementById('counts').textContent = `Total ${total} | Online ${online} | Offline ${offline}`;
    document.getElementById('total').textContent='Total: '+total;
    document.getElementById('online').textContent='Online: '+online;
    document.getElementById('offline').textContent='Offline: '+offline;
    document.getElementById('critical').textContent=crit;
    document.getElementById('pill').textContent='LIVE STATUS - Updated '+new Date().toLocaleTimeString();
    document.getElementById('cards').innerHTML=list.map(x=>{
      let name=x.name||x.hostname||'Device';
      let ip=x.ip||x.ip_address||'';
      let isUp=(x.status||'').toUpperCase()==='UP';
      let type=x.device_type||'';
      return `<div class="card ${isUp?'':'red'}"><span class="dot"></span><b>${name}</b><p>${isUp?'Online':'Offline'}</p><small>${ip} ${type?'- '+type:''}</small></div>`;
    }).join('')||'No devices returned from API';
    // Faults - like PPT, with recommendation
    let off=list.filter(x=> (x.status||'').toUpperCase()==='DOWN');
    let html='';
    for(let x of off){
      let rec=null;
      try{ let rr=await fetch('/api/recommendation/R01'); if(rr.ok) rec=await rr.json(); }catch(e){}
      html+=`<div class="fault"><h3>ACTIVE FAULT: ${x.name||x.hostname} Not Reachable</h3>
      <p><b>Device:</b> ${x.name} (${x.ip}) | <b>Rule:</b> R01 | <b>Severity:</b> Critical</p>
      <p><b>WHY IT HAPPENED:</b> ${rec?.probable_cause||'Device not replying to ping - power off, cable unplugged, or interface down'}</p>
      <p><b>HOW TO FIX IT:</b> ${rec?.recommended_action||'Check power, check cable, restart device, check switch port'}</p>
      <p><b>HOW TO CHECK:</b> ${rec?.verification_step||'Ping '+x.ip+' after fix, check port LED'}</p>
      <button onclick="ack(this)">Acknowledge</button></div>`;
    }
    document.getElementById('faults').innerHTML=html;
  }catch(e){ document.getElementById('cards').textContent='API Error: '+e; }
}
function ack(b){ b.textContent='Acknowledged ✓'; b.style.background='#334155'; }
load(); setInterval(load,5000);
</script></body></html>
